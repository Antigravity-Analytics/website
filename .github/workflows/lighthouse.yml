name: Lighthouse

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Lighthouse CI against the live homepage
        run: |
          npm install -g @lhci/cli@0.15.x
          lhci autorun --config=lighthouserc.json
