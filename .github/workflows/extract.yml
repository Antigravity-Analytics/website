name: Extract website zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website files
        run: |
          unzip -o deploy-mise-form-2026-10-26.zip
          rm deploy-mise-form-2026-10-26.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract website files from zip" || echo "Nothing to commit"
          git push
